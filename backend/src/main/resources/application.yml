server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ledgerline
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ledgerline:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  financial:
    default-currency: INR
    system-clearing-account: ACC-SYSTEM-CLEARING
